<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="野帳入力">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>野帳入力</title>
<style>
  :root {
    --bg: #f2f4f8; --card: #fff; --ink: #1d2433; --sub: #667085; --line: #d9dee8;
    --brand: #1f5fd6; --yellow: #fff7b0; --yellow-line: #e6c800; --err: #c62828; --ok: #1b7f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1c212c; --ink: #e8ecf3; --sub: #9aa4b5; --line: #2e3544;
      --brand: #5b8ff0; --yellow: #3d3816; --yellow-line: #8a7a14; --err: #ef6b6b; --ok: #4cc27a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 -apple-system, "Hiragino Sans", "Meiryo", sans-serif;
         padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff;
           padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; }
  header select { max-width: 55%; font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 0; }
  header button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px;
                  font-size: 15px; padding: 7px 10px; }
  main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; color: var(--sub); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > label { flex: 1; min-width: 0; }
  label span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 3px; }
  input { width: 100%; font-size: 22px; padding: 10px 10px; border-radius: 10px;
          border: 2px solid var(--yellow-line); background: var(--yellow); color: var(--ink);
          font-variant-numeric: tabular-nums; }
  input:focus { outline: 3px solid var(--brand); outline-offset: 1px; }
  input.bad { border-color: var(--err); }
  input.fixed { background: transparent; border-color: var(--line); }
  .pm { position: relative; }
  .pm input { padding-right: 44px; }
  .pm button { position: absolute; right: 4px; bottom: 6px; width: 36px; height: 36px; border-radius: 8px;
               border: 1px solid var(--yellow-line); background: var(--card); color: var(--ink); font-size: 20px; padding: 0; }
  input.memo { font-size: 18px; }
  .sub { display: block; font-size: 12px; color: var(--sub); white-space: normal; }
  .result { display: flex; justify-content: space-between; margin-top: 12px; padding: 10px 12px;
            border-radius: 10px; background: var(--bg); font-variant-numeric: tabular-nums; font-size: 18px; }
  .result b { font-weight: 600; }
  .msg { color: var(--err); font-size: 14px; min-height: 20px; margin-top: 6px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns button { flex: 1; font-size: 18px; padding: 13px; border-radius: 12px; border: 0; font-weight: 600; }
  .primary { background: var(--brand); color: #fff; }
  .ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line) !important; }
  .danger { background: transparent; color: var(--err); border: 1px solid var(--err) !important; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--sub); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tr.sel td { background: var(--yellow); }
  tbody tr { cursor: pointer; }
  .empty { color: var(--sub); text-align: center; padding: 18px 0; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
           padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; }
  footer .state { flex: 1; font-size: 13px; color: var(--sub); }
  footer .state.dirty { color: var(--err); }
  footer button { font-size: 17px; padding: 12px 16px; border-radius: 12px; border: 0; background: var(--ok); color: #fff; font-weight: 600; }
  .note { font-size: 13px; color: var(--sub); }
  .projbar { display: flex; gap: 8px; align-items: center; }
  .projbar select { flex: 1; font-size: 17px; padding: 9px 8px; border-radius: 10px; border: 1px solid var(--line);
                    background: var(--card); color: var(--ink); }
  .projbar button { font-size: 20px; width: 46px; height: 42px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; }
  .home { display: flex; flex-direction: column; gap: 14px; padding: 24px 16px; max-width: 520px; margin: 0 auto; }
  .home p { color: var(--sub); margin: 0 0 4px; }
  .home button { display: block; width: 100%; text-align: left; padding: 22px 20px; border-radius: 16px; border: 2px solid var(--line);
                 background: var(--card); color: var(--ink); font-size: 22px; font-weight: 700; }
  .home button small { display: block; font-size: 14px; font-weight: 400; color: var(--sub); margin-top: 6px; }
  .home button.last { border-color: var(--brand); }
  .check { font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1 id="title">📐 野帳入力</h1>
  <button id="modeBtn" hidden>種類を選び直す</button>
</header>

<section class="home" id="home">
  <p>今回測るのはどちらですか？</p>
  <button id="goTs">📡 光波<small>測点・水平距離・角度（度分秒）→ X・Y</small></button>
  <button id="goLv">📏 レベル<small>後視・前視 → 機械高・地盤高（器高式）</small></button>
</section>

<main id="tsMain" hidden>
  <section class="card">
    <h2>案件（光波）</h2>
    <div class="projbar"><select id="proj" aria-label="案件"></select><button id="newProj" aria-label="案件を追加">＋</button></div>
  </section>
  <section class="card">
    <h2>器械点・後視</h2>
    <div class="row">
      <label><span>器械点（X, Y）</span><input class="fixed" value="0 , 0" disabled></label>
      <label><span>後視(BM)の水平距離</span>
        <input id="bs" inputmode="decimal" enterkeyhint="done" placeholder="20.36"></label>
    </div>
  </section>

  <section class="card" id="entry">
    <h2 id="entryTitle">測点を入力</h2>
    <div class="row">
      <label style="flex:.8"><span>測点</span><input id="f_name" enterkeyhint="next"></label>
      <label><span>水平距離</span><input id="f_dist" inputmode="decimal" enterkeyhint="next"></label>
      <label style="flex:.9" class="pm"><span>高低差</span><input id="f_dh" inputmode="decimal" enterkeyhint="next"><button type="button" id="dhSign" aria-label="プラスマイナスを切り替える">±</button></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label><span>度（時）</span><input id="f_d" inputmode="numeric" enterkeyhint="next"></label>
      <label><span>分</span><input id="f_m" inputmode="numeric" enterkeyhint="next"></label>
      <label><span>秒</span><input id="f_s" inputmode="decimal" enterkeyhint="done"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label style="flex:.6"><span>ミラー高さ</span><input id="f_mh" inputmode="decimal" enterkeyhint="done"></label>
      <label><span>メモ</span><input id="f_memo" class="memo" enterkeyhint="done" placeholder="境界杭・法肩 など"></label>
    </div>
    <div class="result"><span>X <b id="rx">—</b></span><span>Y <b id="ry">—</b></span></div>
    <div class="msg" id="msg"></div>
    <div class="btns" id="addBtns"><button class="primary" id="add">追加して次へ</button></div>
    <div class="btns" id="editBtns" hidden>
      <button class="primary" id="update">直す</button>
      <button class="danger" id="del">消す</button>
      <button class="ghost" id="cancel">やめる</button>
    </div>
  </section>

  <section class="card">
    <h2>入力済み <span id="count"></span></h2>
    <table>
      <thead><tr><th>測点</th><th>距離</th><th>角度</th><th>X</th><th>Y</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <p class="note">行をタップすると直せます。入力した値はこのスマホの中に保存されます（通信はしません）。</p>
  </section>

  <section class="card">
    <h2>この案件</h2>
    <div class="btns">
      <button class="ghost" id="renameProj">名前を変える</button>
      <button class="danger" id="deleteProj">案件を消す</button>
    </div>
  </section>
  <footer>
    <div class="state" id="state"></div>
    <button id="save">Boxに保存</button>
  </footer>
</main>

<main id="lvMain" hidden>
  <section class="card">
    <h2>案件（レベル）</h2>
    <div class="projbar"><select id="lvProj" aria-label="案件"></select><button id="lvNew" aria-label="案件を追加">＋</button></div>
  </section>
  <section class="card">
    <h2>BM</h2>
    <label><span>BM の標高（1行目の地盤高）</span><input id="lvBm" inputmode="decimal" enterkeyhint="done" placeholder="100.000"></label>
  </section>
  <section class="card" id="lvEntry">
    <h2 id="lvTitle">測点を入力</h2>
    <div class="row">
      <label><span>測点</span><input id="l_name" enterkeyhint="next"></label>
      <label><span>距離</span><input id="l_dist" inputmode="decimal" enterkeyhint="next" placeholder="前の点から"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label><span>後視 BS</span><input id="l_bs" inputmode="decimal" enterkeyhint="next"></label>
      <label><span>前視 FS</span><input id="l_fs" inputmode="decimal" enterkeyhint="next"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label style="flex:.8"><span>計画高 FH</span><input id="l_fh" inputmode="decimal" enterkeyhint="done"></label>
      <label><span>メモ</span><input id="l_memo" class="memo" enterkeyhint="done" placeholder="TP・水路際 など"></label>
    </div>
    <p class="note" id="lvHint"></p>
    <div class="result"><span>機械高 <b id="l_rih">—</b></span><span>地盤高 <b id="l_rgh">—</b></span><span>差 <b id="l_rdf">—</b></span></div>
    <div class="msg" id="lvMsg"></div>
    <div class="btns" id="lvAddBtns"><button class="primary" id="lvAdd">追加して次へ</button></div>
    <div class="btns" id="lvEditBtns" hidden>
      <button class="primary" id="lvUpdate">直す</button>
      <button class="danger" id="lvDel">消す</button>
      <button class="ghost" id="lvCancel">やめる</button>
    </div>
  </section>
  <section class="card">
    <h2>入力済み <span id="lvCount"></span></h2>
    <table>
      <thead><tr><th>測点</th><th>後視</th><th>前視</th><th>機械高</th><th>地盤高</th><th>差</th></tr></thead>
      <tbody id="lvList"></tbody>
    </table>
    <div class="check" id="lvCheck"></div>
    <p class="note">行をタップすると直せます。差 = 計画高 − 地盤高（＋は盛土、−は切土）。入力した値はこのスマホの中に保存されます（通信はしません）。</p>
  </section>
  <section class="card">
    <h2>この案件</h2>
    <div class="btns">
      <button class="ghost" id="lvRename">名前を変える</button>
      <button class="danger" id="lvDeleteProj">案件を消す</button>
    </div>
  </section>
  <footer>
    <div class="state" id="lvState"></div>
    <button id="lvSave">Boxに保存</button>
  </footer>
</main>

<script>
"use strict";
const KEY = "sokuryo_note_v1";
const $ = (id) => document.getElementById(id);
const FIELDS = ["f_name", "f_dist", "f_dh", "f_d", "f_m", "f_s"];

// ---------------------------------------------------------------- 保存（このスマホの中だけ）
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.projects) return s; } catch (e) {}
  return { current: "", projects: {} };
}
let store = load();
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch (e) { alert("このスマホに保存できませんでした。早めに「Boxに保存」してください。"); }
}
function proj() { return store.projects[store.current]; }

// ---------------------------------------------------------------- 計算
// 器械点(0,0)、後視BMを X 方向に置く（後視の方向角=0）。方向角 = 度+分/60+秒/3600
function num(v) { v = String(v ?? "").trim(); if (v === "") return null; const n = Number(v); return isFinite(n) ? n : NaN; }
function calc(r) {
  const L = num(r.dist), d = num(r.d), m = num(r.m) ?? 0, s = num(r.s) ?? 0;
  if (L === null || d === null) return null;
  if ([L, d, m, s].some(Number.isNaN)) return { err: "数字で入れてください" };
  if (d >= 360 || m >= 60 || s >= 60 || d < 0 || m < 0 || s < 0) return { err: "度は0〜359、分・秒は0〜59で入れてください" };
  const az = (d + m / 60 + s / 3600) * Math.PI / 180;
  return { x: L * Math.cos(az), y: L * Math.sin(az) };
}
const f4 = (v) => v.toFixed(4);

// ---------------------------------------------------------------- 画面
let editing = -1;
function readForm() {
  return { name: $("f_name").value.trim(), dist: $("f_dist").value.trim(), dh: $("f_dh").value.trim(),
           d: $("f_d").value.trim(), m: $("f_m").value.trim(), s: $("f_s").value.trim(),
           mh: $("f_mh").value.trim(), memo: $("f_memo").value.trim() };
}
function fillForm(r) {
  $("f_name").value = r.name; $("f_dist").value = r.dist; $("f_dh").value = r.dh;
  $("f_d").value = r.d; $("f_m").value = r.m; $("f_s").value = r.s;
  $("f_mh").value = r.mh ?? ""; $("f_memo").value = r.memo ?? "";
}
// ミラー高さは、直前に入力した点の値を引き継ぐ
function lastMh() {
  const rows = proj().rows;
  for (let i = rows.length - 1; i >= 0; i--) if (rows[i].mh) return rows[i].mh;
  return "";
}
function nextName() {
  const rows = proj().rows;
  for (let i = rows.length - 1; i >= 0; i--) {
    const n = rows[i].name;
    if (/^\d+$/.test(n)) return String(Number(n) + 1);
    const m = n.match(/^(.*?)(\d+)$/);
    if (m) return m[1] + (Number(m[2]) + 1);
  }
  return String(rows.length + 1);
}
function preview() {
  const c = calc(readForm());
  $("rx").textContent = c && !c.err ? f4(c.x) : "—";
  $("ry").textContent = c && !c.err ? f4(c.y) : "—";
  $("msg").textContent = c && c.err ? c.err : "";
}
function renderList() {
  const rows = proj().rows, tb = $("list");
  $("count").textContent = rows.length ? `（${rows.length}点）` : "";
  tb.innerHTML = "";
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="5" class="empty">まだありません</td></tr>'; return; }
  rows.forEach((r, i) => {
    const c = calc(r) || {};
    const tr = document.createElement("tr");
    if (i === editing) tr.className = "sel";
    const cells = [r.name, r.dist, `${r.d}°${String(r.m || 0).padStart(2, "0")}′${String(r.s || 0).padStart(2, "0")}″`,
                   c.err || c.x === undefined ? "—" : f4(c.x), c.err || c.y === undefined ? "—" : f4(c.y)];
    cells.forEach((v) => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    if (r.memo) { const m = document.createElement("span"); m.className = "sub"; m.textContent = r.memo; tr.firstChild.appendChild(m); }
    tr.onclick = () => startEdit(i);
    tb.appendChild(tr);
  });
}
function renderState() {
  const p = proj();
  const st = $("state");
  if (!p.rows.length) { st.textContent = ""; st.className = "state"; return; }
  if (p.dirty) { st.textContent = "● Box にまだ保存していません"; st.className = "state dirty"; }
  else { st.textContent = `Box に保存済み（${p.savedAt}）`; st.className = "state"; }
}
function renderProjects() {
  const sel = $("proj"); sel.innerHTML = "";
  Object.keys(store.projects).forEach((n) => { const o = document.createElement("option"); o.textContent = n; sel.appendChild(o); });
  sel.value = store.current;
}
function render() {
  renderProjects();
  $("bs").value = proj().bs ?? "";
  renderList(); renderState(); resetForm();
}
function resetForm() {
  editing = -1;
  fillForm({ name: nextName(), dist: "", dh: "", d: "", m: "", s: "", mh: lastMh(), memo: "" });
  $("entryTitle").textContent = "測点を入力";
  $("addBtns").hidden = false; $("editBtns").hidden = true;
  preview();
}
function startEdit(i) {
  editing = i; fillForm(proj().rows[i]);
  $("entryTitle").textContent = `測点 ${proj().rows[i].name} を直す`;
  $("addBtns").hidden = true; $("editBtns").hidden = false;
  preview(); renderList();
  $("entry").scrollIntoView({ behavior: "smooth" });
}
function changed() { proj().dirty = true; persist(); renderList(); renderState(); }

function validRow(r) {
  const c = calc(r);
  if (!r.name) return "測点を入れてください";
  if (!c) return "水平距離と度を入れてください";
  if (c.err) return c.err;
  if (num(r.dh) !== null && Number.isNaN(num(r.dh))) return "高低差は数字で入れてください";
  if (num(r.mh) !== null && Number.isNaN(num(r.mh))) return "ミラー高さは数字で入れてください";
  return "";
}
$("add").onclick = () => {
  const r = readForm(), e = validRow(r);
  if (e) { $("msg").textContent = e; return; }
  if (proj().rows.some((x) => x.name === r.name) && !confirm(`測点 ${r.name} は既にあります。追加しますか？`)) return;
  proj().rows.push(r); changed(); resetForm();
  $("f_dist").focus();
};
$("update").onclick = () => {
  const r = readForm(), e = validRow(r);
  if (e) { $("msg").textContent = e; return; }
  proj().rows[editing] = r; changed(); resetForm();
};
$("del").onclick = () => {
  if (!confirm(`測点 ${proj().rows[editing].name} を消しますか？`)) return;
  proj().rows.splice(editing, 1); changed(); resetForm();
};
$("cancel").onclick = () => { resetForm(); renderList(); };

// Enter（次へ）で次の欄、最後の欄で追加
FIELDS.forEach((id, i) => {
  $(id).addEventListener("input", preview);
  $(id).addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    if (i < FIELDS.length - 1) $(FIELDS[i + 1]).focus();
    else (editing < 0 ? $("add") : $("update")).click();
  });
});
$("dhSign").onclick = () => {
  const v = $("f_dh").value.trim();
  $("f_dh").value = v.startsWith("-") ? v.slice(1) : "-" + v;
  $("f_dh").focus();
};
["f_mh", "f_memo"].forEach((id) => $(id).addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  ev.preventDefault();
  (editing < 0 ? $("add") : $("update")).click();
}));
$("bs").addEventListener("change", () => { proj().bs = $("bs").value.trim(); changed(); });

// ---------------------------------------------------------------- 案件
function addProject(name) {
  name = (name || "").trim().replace(/[\\/:*?"<>|]/g, "_");
  if (!name) return false;
  if (store.projects[name]) { alert("同じ名前の案件があります。"); return false; }
  store.projects[name] = { bs: "", rows: [], dirty: false, savedAt: "" };
  store.current = name; persist(); render(); return true;
}
$("newProj").onclick = () => addProject(prompt("案件名（PCのアプリと同じ名前にすると読み込みが簡単です）"));
$("proj").onchange = () => { store.current = $("proj").value; persist(); render(); };
$("renameProj").onclick = () => {
  const n = prompt("新しい案件名", store.current);
  if (!n || n === store.current || store.projects[n]) return;
  store.projects[n] = proj(); delete store.projects[store.current]; store.current = n; persist(); render();
};
$("deleteProj").onclick = () => {
  const p = proj();
  if (p.dirty && p.rows.length && !confirm("Box に保存していない入力があります。それでも消しますか？")) return;
  if (!confirm(`案件「${store.current}」をこのスマホから消しますか？`)) return;
  delete store.projects[store.current];
  store.current = Object.keys(store.projects)[0] || "";
  if (!store.current) addProject("案件1"); else { persist(); render(); }
};

// ---------------------------------------------------------------- Box に保存（野帳テンプレートと同じ書式の Excel）
// .xlsx は XML ファイルを zip にまとめたもの。ライブラリを使わず（電波が無くても動くように）ここで組み立てる
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

    else if (n !== null && !Number.isNaN(n)) put(ref, `<c r="${ref}" s="${s}"><v>${n}</v></c>`);
    else str(ref, v, s);
  };
  const fml = (ref, f, v, s) => put(ref, `<c r="${ref}" s="${s}"${v == null ? ' t="str"' : ""}><f>${xe(f)}</f>${v == null ? "<v></v>" : `<v>${v}</v>`}</c>`);
  str("A1", "レベル野帳（器高式）", 4);
  str("A2", `${lv.current}　黄色のセルを入力すると 機械高・地盤高・差 が自動計算されます（1行目は BM）`, 5);
  const heads = [["測点", ""], ["距離", "(m)"], ["後視", "BS"], ["機械高", "IH"], ["前視", "FS"], ["地盤高", "GH"], ["計画高", "FH"], ["差", "FH−GH"], ["メモ", ""]];
  heads.forEach(([a, b], j) => { str(`${"ABCDEFGHI"[j]}4`, a, 1); str(`${"ABCDEFGHI"[j]}5`, b, 1); });
  for (let k = 0; k < N; k++) {
    const r = F + k, d = p.rows[k] || {}, c = out[k] || {};
    val(`A${r}`, k < p.rows.length ? d.name : (k === 0 ? "BM" : ""), 2);
    val(`B${r}`, d.dist ?? "", 10);
    val(`C${r}`, d.bs ?? "", 10);
    fml(`D${r}`, `IF(C${r}="","",F${r}+C${r})`, c.ih ?? null, 9);
    val(`E${r}`, d.fs ?? "", 10);
    if (k === 0) val(`F${r}`, bm ?? "", 10);
    else fml(`F${r}`, `IF(E${r}="","",LOOKUP(2,1/(D$${F}:D${r - 1}<>""),D$${F}:D${r - 1})-E${r})`, c.gh ?? null, 9);
    val(`G${r}`, d.fh ?? "", 10);
    fml(`H${r}`, `IF(OR(G${r}="",F${r}=""),"",G${r}-F${r})`, c.diff ?? null, 9);
    val(`I${r}`, d.memo ?? "", 2);
  }
  const widths = [10, 8, 9, 10, 9, 10, 10, 9, 18];
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${
    widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${
    Object.keys(rows).map(Number).sort((a, b) => a - b).map((r) => `<row r="${r}">${rows[r].join("")}</row>`).join("")
  }</sheetData></worksheet>`;
  return zip([
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="レベル野帳" sheetId="1" r:id="rId1"/></sheets><calcPr fullCalcOnLoad="1"/></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", STYLES],
    ["xl/worksheets/sheet1.xml", sheet],
  ]);
}
$("lvSave").onclick = async () => {
  const p = lvProj();
  if (!p.rows.length) { alert("まだ測点がありません。"); return; }
  const fname = `${lv.current}_レベル.xlsx`;
  const file = new File([lvToXlsx()], fname, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  let done = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: fname }); done = true; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  if (!done) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = fname; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  if (confirm("Box の「sokuryo_jw › 野帳」フォルダに保存できましたか？")) {
    const t = new Date();
    p.dirty = false; p.savedAt = `${t.getMonth() + 1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")}`;
    lvPersist(); lvRenderState();
  }
};
if (!lv.current || !lv.projects[lv.current]) {
  const first = Object.keys(lv.projects)[0];
  if (first) lv.current = first;
  else { lv.projects["案件1"] = { bm: "100.000", rows: [], dirty: false, savedAt: "" }; lv.current = "案件1"; }
  lvPersist();
}

// ================================================================ 光波／レベルの選択
function showMode(m) {
  $("home").hidden = !!m;
  $("tsMain").hidden = m !== "ts";
  $("lvMain").hidden = m !== "lv";
  $("modeBtn").hidden = !m;
  $("title").textContent = m === "ts" ? "📡 光波の野帳" : m === "lv" ? "📏 レベルの野帳" : "📐 野帳入力";
  if (m) { try { localStorage.setItem("sokuryo_mode", m); } catch (e) {} }
  if (m === "ts") render();
  if (m === "lv") lvRender();
  const last = (() => { try { return localStorage.getItem("sokuryo_mode"); } catch (e) { return null; } })();
  $("goTs").classList.toggle("last", last === "ts");
  $("goLv").classList.toggle("last", last === "lv");
  window.scrollTo(0, 0);
}
$("goTs").onclick = () => showMode("ts");
$("goLv").onclick = () => showMode("lv");
$("modeBtn").onclick = () => showMode("");
showMode("");
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
